<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Something beautiful is waiting...</title>
<style>
  :root{
    --ink: #f7ece2;
    --ink-dim: #d9c3c9;
    --plum-deep: #170a13;
    --plum: #2a0f22;
    --wine: #4a1230;
    --rose: #e8a0b4;
    --rose-bright: #ff8fa8;
    --gold: #e8c48a;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html, body{
    height:100%;
    overflow:hidden;
  }

  body{
    font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    background: radial-gradient(ellipse at 50% 20%, var(--wine) 0%, var(--plum) 45%, var(--plum-deep) 100%);
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Background layers ===== */
  #stars, #particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }

  #glow-orb{
    position:fixed;
    top:50%;
    left:50%;
    width:120vmax;
    height:120vmax;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle, rgba(232,160,180,0.10) 0%, rgba(232,160,180,0) 55%);
    animation: drift 18s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes drift{
    0%, 100%{ transform: translate(-52%,-50%) scale(1); }
    50%{ transform: translate(-48%,-52%) scale(1.08); }
  }

  /* ===== Main content ===== */
  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:560px;
    padding: 32px 24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap: clamp(18px, 4vh, 34px);
  }

  .eyebrow{
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    font-style: italic;
    color: var(--ink-dim);
    letter-spacing: 0.02em;
    line-height:1.5;
    max-width: 22ch;
    opacity:0;
    animation: rise 1.4s ease forwards 0.2s;
  }

  .clock{
    position:relative;
    width:100%;
    padding: clamp(22px, 6vw, 42px) clamp(14px, 5vw, 36px);
    border-radius: 28px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255, 220, 230, 0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow:
      0 0 60px rgba(232,160,180,0.15),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 20px 60px rgba(0,0,0,0.35);
    opacity:0;
    animation: rise 1.4s ease forwards 0.45s, pulseGlow 4.5s ease-in-out infinite 1.9s;
  }

  @keyframes pulseGlow{
    0%, 100%{ box-shadow: 0 0 60px rgba(232,160,180,0.15), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 20px 60px rgba(0,0,0,0.35); }
    50%{ box-shadow: 0 0 90px rgba(232,160,180,0.28), 0 0 0 1px rgba(255,255,255,0.03) inset, 0 20px 60px rgba(0,0,0,0.35); }
  }

  .digits{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap: clamp(4px, 1.6vw, 10px);
    flex-wrap: nowrap;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width: 2.1ch;
  }

  .unit .value{
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.1rem, 9.5vw, 3.6rem);
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-shadow: 0 0 18px rgba(255, 200, 215, 0.45), 0 0 46px rgba(232,160,180,0.25);
    line-height:1;
  }

  .unit.ms .value{
    font-size: clamp(1.3rem, 5.6vw, 2.1rem);
    color: var(--rose);
    opacity:0.9;
  }

  .unit .label{
    margin-top: 8px;
    font-size: clamp(0.6rem, 2vw, 0.72rem);
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    font-style: italic;
  }

  .colon{
    font-size: clamp(1.6rem, 7vw, 2.6rem);
    color: var(--rose);
    opacity:0.55;
    transform: translateY(-6px);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink{
    0%, 100%{ opacity:0.25; }
    50%{ opacity:0.65; }
  }

  .sub{
    font-size: clamp(1rem, 3.4vw, 1.2rem);
    font-style: italic;
    color: var(--ink-dim);
    opacity:0;
    animation: rise 1.4s ease forwards 0.7s;
  }

  .sub .heart{
    color: var(--rose-bright);
  }

  .cta{
    display:inline-block;
    margin-top: 4px;
    padding: 14px 34px;
    font-family: inherit;
    font-size: clamp(0.95rem, 3vw, 1.05rem);
    font-style: italic;
    color: var(--plum-deep);
    background: linear-gradient(135deg, var(--gold), var(--rose));
    border: none;
    border-radius: 999px;
    cursor:pointer;
    text-decoration:none;
    box-shadow: 0 8px 30px rgba(232,160,180,0.35);
    opacity:0;
    animation: rise 1.4s ease forwards 0.95s;
    transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.4s ease, opacity 0.4s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .cta:active{
    transform: scale(0.96);
    box-shadow: 0 4px 16px rgba(232,160,180,0.3);
  }

  /* Disabled state: the button stays visible but does nothing until
     the countdown reaches zero. */
  .cta.disabled{
    cursor: default;
    pointer-events: none;
    filter: grayscale(0.6) brightness(0.7);
    box-shadow: none;
  }

  .cta.disabled:active{
    transform: none;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ===== Completion overlay ===== */
  #finale{
    position:fixed;
    inset:0;
    z-index: 10;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 50%, rgba(255,200,215,0.35), var(--plum-deep) 70%);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.6s ease;
  }

  #finale.show{
    opacity:1;
    pointer-events:all;
  }

  #finale span{
    font-size: clamp(2rem, 9vw, 3.4rem);
    font-style: italic;
    color: var(--ink);
    text-shadow: 0 0 30px rgba(255,255,255,0.6);
    animation: finalePop 0.9s ease;
  }

  @keyframes finalePop{
    0%{ transform: scale(0.7); opacity:0; }
    60%{ transform: scale(1.08); opacity:1; }
    100%{ transform: scale(1); opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  @media (max-height: 480px){
    .stage{ gap: 12px; padding: 16px; }
    .clock{ padding: 16px 14px; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <canvas id="particles"></canvas>
  <div id="glow-orb"></div>

  <main class="stage">
    <p class="eyebrow">Something beautiful is waiting for you&hellip;</p>

    <div class="clock">
      <div class="digits" id="digits">
        <div class="unit">
          <span class="value" id="hh">00</span>
          <span class="label">hours</span>
        </div>
        <span class="colon">:</span>
        <div class="unit">
          <span class="value" id="mm">00</span>
          <span class="label">min</span>
        </div>
        <span class="colon">:</span>
        <div class="unit">
          <span class="value" id="ss">00</span>
          <span class="label">sec</span>
        </div>
        <span class="colon">:</span>
        <div class="unit ms">
          <span class="value" id="ms">000</span>
          <span class="label">ms</span>
        </div>
      </div>
    </div>

    <p class="sub">Just a little longer <span class="heart">&#10084;</span></p>

    <a class="cta disabled" id="fallbackBtn" href="javascript:void(0)" aria-disabled="true">Not yet&hellip;</a>
  </main>

  <div id="finale"><span id="finaleText">It's time &#10084;</span></div>

<script>
  // ==============================
  // EDIT THIS DATE AND TIME
  // ==============================
  // This is the ONLY value you need to change.
  // Format: "YYYY-MM-DDTHH:MM:SS" using the 24-hour clock, in your
  // browser's local time zone.
  const TARGET_DATE = "2026-09-16T00:00:00";

  // Where to send her once the countdown finishes.
  const DESTINATION_URL = "https://nortsen88-code.github.io/happy2anniversary/";
  // ==============================

  const targetTime = new Date(TARGET_DATE).getTime();

  const hhEl = document.getElementById('hh');
  const mmEl = document.getElementById('mm');
  const ssEl = document.getElementById('ss');
  const msEl = document.getElementById('ms');
  const fallbackBtn = document.getElementById('fallbackBtn');
  const finale = document.getElementById('finale');

  // The button stays inert (no href, no click) until the countdown
  // actually reaches zero — see enableFallbackButton() in triggerFinale().
  fallbackBtn.addEventListener('click', function(e){
    if (fallbackBtn.classList.contains('disabled')){
      e.preventDefault();
    }
  });

  function enableFallbackButton(){
    fallbackBtn.classList.remove('disabled');
    fallbackBtn.removeAttribute('aria-disabled');
    fallbackBtn.href = DESTINATION_URL;
    fallbackBtn.textContent = 'Open Our Story \u2764';
  }

  let redirected = false;
  let rafId = null;

  function pad(num, len){
    return String(num).padStart(len, '0');
  }

  function triggerFinale(){
    if (redirected) return;
    redirected = true;

    if (rafId !== null){
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    // Lock the display at all zeros.
    hhEl.textContent = pad(0, 2);
    mmEl.textContent = pad(0, 2);
    ssEl.textContent = pad(0, 2);
    msEl.textContent = pad(0, 3);

    finale.classList.add('show');
    enableFallbackButton();

    // Keep the delay short so the redirect still feels immediate.
    setTimeout(function(){
      window.location.href = DESTINATION_URL;
    }, 700);
  }

  function tick(){
    if (redirected) return;

    const remaining = targetTime - Date.now();

    if (remaining <= 0){
      triggerFinale();
      return;
    }

    const totalMs = remaining;
    const hours = Math.floor(totalMs / 3600000);
    const minutes = Math.floor((totalMs % 3600000) / 60000);
    const seconds = Math.floor((totalMs % 60000) / 1000);
    const millis = Math.floor(totalMs % 1000);

    hhEl.textContent = pad(hours, 2);
    mmEl.textContent = pad(minutes, 2);
    ssEl.textContent = pad(seconds, 2);
    msEl.textContent = pad(millis, 3);

    rafId = requestAnimationFrame(tick);
  }

  // If the target date is already in the past, fire immediately.
  if (targetTime - Date.now() <= 0){
    triggerFinale();
  } else {
    rafId = requestAnimationFrame(tick);
  }

  // ===== Background: soft stars =====
  (function stars(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let w, h, points;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      const count = Math.min(90, Math.floor((w * h) / 14000));
      points = [];
      for (let i = 0; i < count; i++){
        points.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.3 + 0.3,
          baseAlpha: Math.random() * 0.5 + 0.2,
          speed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function draw(t){
      ctx.clearRect(0, 0, w, h);
      for (const p of points){
        const alpha = p.baseAlpha + Math.sin(t * p.speed + p.phase) * 0.25;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(247,236,226,${Math.max(0, alpha)})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();

  // ===== Background: floating hearts / particles =====
  (function particles(){
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let w, h, drops;

    function resize(){
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      const count = Math.min(22, Math.floor(w / 45));
      drops = [];
      for (let i = 0; i < count; i++){
        drops.push(makeDrop(true));
      }
    }

    function makeDrop(randomY){
      return {
        x: Math.random() * w,
        y: randomY ? Math.random() * h : h + 20,
        size: Math.random() * 10 + 6,
        speed: Math.random() * 0.35 + 0.15,
        drift: (Math.random() - 0.5) * 0.4,
        alpha: Math.random() * 0.35 + 0.15,
        sway: Math.random() * Math.PI * 2
      };
    }

    function heart(ctx, x, y, size, alpha){
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size / 20, size / 20);
      ctx.beginPath();
      ctx.moveTo(0, 4);
      ctx.bezierCurveTo(0, -4, -10, -4, -10, 3);
      ctx.bezierCurveTo(-10, 9, -4, 12, 0, 17);
      ctx.bezierCurveTo(4, 12, 10, 9, 10, 3);
      ctx.bezierCurveTo(10, -4, 0, -4, 0, 4);
      ctx.closePath();
      ctx.fillStyle = `rgba(255,143,168,${alpha})`;
      ctx.fill();
      ctx.restore();
    }

    function draw(){
      ctx.clearRect(0, 0, w, h);
      for (const d of drops){
        d.y -= d.speed;
        d.sway += 0.01;
        d.x += Math.sin(d.sway) * 0.15 + d.drift * 0.05;

        heart(ctx, d.x, d.y, d.size, d.alpha);

        if (d.y < -20){
          Object.assign(d, makeDrop(false), { x: Math.random() * w });
        }
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  })();
</script>

</body>
</html>
